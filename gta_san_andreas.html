<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA San Andreas - Play in Browser</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #game-frame {
            width: 100%;
            height: 100vh;
            border: 0;
            display: block;
            background: #000;
        }
        @media (max-width: 768px) {
            #game-frame { height: 100vh; }
        }
    </style>
</head>
<body>
    <!-- GTA San Andreas: playable in browser via WebAssembly (PCSX2 / TabStation) -->
    <iframe
        id="game-frame"
        src="https://pixr.dev/gta/gtasa/"
        title="Play GTA San Andreas in your browser"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad; pointer-lock; keyboard-interactive"
        referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
</body>
</html>
